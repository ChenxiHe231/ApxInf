[package]
name = "apxinf-model"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
apxinf-core = { path = "../apxinf-core" }
apxinf-mlx = { path = "../apxinf-mlx", optional = true }
apxinf-cuda = { path = "../apxinf-cuda", optional = true }
apxinf-cuda-new = { path = "../apxinf-cuda-new", optional = true }
apxinf-hip = { path = "../apxinf-hip", optional = true }
apxinf-loader = { path = "../apxinf-loader" }
thiserror = "1"
once_cell = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }

[features]
default = []
mlx = ["dep:apxinf-mlx", "apxinf-mlx/native", "dep:sha2"]
# Qwen3.5-35B-A3B owns its CUDA execution and sampling in `apxinf-cuda-new`.
# Keep this feature separate so building that model never compiles or links the
# legacy `apxinf-cuda` runtime.
qwen35-cuda = ["dep:apxinf-cuda-new"]
# Full NVIDIA CUDA inference: links both the legacy (`apxinf-cuda`) runtime and
# the current runtime, and enables every CUDA model family.
cuda = ["dep:apxinf-cuda", "qwen35-cuda"]
# Deprecated alias of `cuda`, kept so existing build commands keep working.
# It no longer gates anything: `cuda` already pulls in `apxinf-cuda-new`, and
# the model code that used to hide behind this flag now follows `cuda`.
cuda-new = ["cuda"]
# Deprecated alias of `cuda`. It gates nothing — `cuda` has always compiled the
# other model families too — and is kept only for existing build commands.
pi05-only = ["cuda"]
# AMD ROCm/HIP inference, independent of both CUDA features: either, both or
# neither can be enabled.
hip = ["dep:apxinf-hip"]

[[example]]
name = "pi05_bench"
required-features = ["cuda"]

[[example]]
name = "pi05_stage_dump"
required-features = ["cuda"]

[[example]]
name = "pi05_hip_bench"
required-features = ["hip"]

[[example]]
name = "gr00t_bench"
required-features = ["cuda"]

[[example]]
name = "pi05_integrity_probe"
required-features = ["cuda"]

[[example]]
name = "pi05_auto_smoke"
required-features = ["cuda"]

[[example]]
name = "pi0_fast_smoke"
required-features = ["cuda"]

[[example]]
name = "multimodal_check"
required-features = ["cuda"]

[[example]]
name = "vision_check"
required-features = ["cuda"]

[[example]]
name = "qwen38_bench"
required-features = ["cuda"]

[[example]]
name = "qwen35_mtp_bench"
required-features = ["qwen35-cuda"]

[[example]]
name = "d3_smoke"
required-features = ["cuda"]

[[example]]
name = "d3_bench"
required-features = ["cuda"]

[[example]]
name = "d3_vision_smoke"
required-features = ["cuda"]

[[example]]
name = "d3_eval"
required-features = ["cuda"]

[[example]]
name = "d3_decision_index"
required-features = ["cuda"]
